# Testing/demo convenience only: publishes the frontend SPA to GitHub
# Pages. This is NOT the hosting approach DECISIONS.md settled on for
# production (S3 + CloudFront) — it's just a quick way to get a public
# HTTPS URL without local network/WSL port-forwarding setup.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [claude/eager-sagan-lf7eqr]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_USER_POOL_ID: ${{ vars.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ vars.VITE_USER_POOL_CLIENT_ID }}
          VITE_UPLOAD_API_BASE_URL: ${{ vars.VITE_UPLOAD_API_BASE_URL }}
          VITE_REVIEW_API_BASE_URL: ${{ vars.VITE_REVIEW_API_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
